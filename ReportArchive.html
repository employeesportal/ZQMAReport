<div class="space-y-4 sm:space-y-6 animate-fade-in flex flex-col h-full relative pb-6 bg-slate-50 min-h-screen p-4">
    
    <!-- Header & Agency Switcher -->
    <div class="bg-white p-4 sm:p-5 rounded-3xl border border-slate-200 shadow-sm flex flex-col md:flex-row items-center justify-between gap-4 shrink-0">
        <div>
            <h2 class="font-black text-base sm:text-lg uppercase text-slate-900 flex items-center gap-2">
                <i data-lucide="folder-open" class="w-5 h-5 text-blue-600"></i> Report Archive
            </h2>
            <p class="text-[11px] sm:text-xs text-slate-500 font-bold">Admin & Coordinator Access — Browse Drive Files</p>
        </div>
        
        <div class="flex p-1 bg-slate-100 rounded-xl border border-slate-200 w-full md:w-auto">
            <button onclick="switchAgencyView('Equalitas')" id="tab-Equalitas" class="flex-1 md:flex-none px-6 py-2.5 rounded-lg text-xs font-black transition bg-blue-600 text-white shadow-md">
                Equalitas
            </button>
            <button onclick="switchAgencyView('A-Mark')" id="tab-A-Mark" class="flex-1 md:flex-none px-6 py-2.5 rounded-lg text-xs font-black transition text-slate-500 hover:text-slate-800 hover:bg-slate-200">
                A-Mark
            </button>
        </div>
    </div>

    <!-- 🎯 FILTERS & ACTIONS BAR -->
    <div class="bg-white p-3 sm:p-4 rounded-2xl border border-slate-200 shadow-sm flex flex-col lg:flex-row items-center gap-2.5 sm:gap-3 shrink-0">
        
        <!-- Search Filter -->
        <div class="relative flex-1 w-full min-w-[250px]">
            <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3.5 top-3.5"></i>
            <input type="text" id="filter-search" oninput="applyFilters()" placeholder="Search currently loaded files..." class="w-full pl-10 pr-4 h-11 border border-slate-300 rounded-xl text-xs font-bold outline-none bg-slate-50 focus:bg-white transition shadow-inner">
        </div>

        <!-- Count & Actions -->
        <div class="flex items-center justify-between lg:justify-end gap-3 w-full lg:w-auto border-t lg:border-t-0 lg:border-l border-slate-200 pt-3 lg:pt-0 lg:pl-4 shrink-0">
            <span id="record-count" class="text-[11px] font-black uppercase text-slate-400 px-2 whitespace-nowrap bg-slate-100 py-1.5 rounded-lg border border-slate-200">0 Reports</span>
            
            <button onclick="loadReportsData(true)" class="px-4 h-11 bg-slate-900 hover:bg-slate-800 text-white rounded-xl transition cursor-pointer flex items-center justify-center shadow-md gap-2" title="Refresh Live Data">
                <i data-lucide="refresh-cw" class="w-4 h-4"></i> <span class="text-xs font-black hidden sm:inline">Sync Drive</span>
            </button>
        </div>
    </div>

    <!-- 🎯 RESPONSIVE DATA CONTAINER -->
    <div class="bg-white border border-slate-200 rounded-3xl shadow-sm flex flex-col flex-1 min-h-[500px] overflow-hidden">
        <div class="overflow-y-auto custom-scrollbar relative flex-1 p-2 sm:p-4 flex flex-col">
            
            <!-- DESKTOP TABLE VIEW -->
            <div class="hidden md:block overflow-x-auto w-full">
                <table class="w-full text-left text-xs border-collapse">
                    <thead class="sticky top-0 bg-slate-100 text-slate-700 uppercase text-[10px] font-black z-10 shadow-sm border-b border-slate-300">
                        <tr>
                            <th class="p-4 rounded-tl-xl border-r border-slate-200 w-16 text-center">S.No.</th>
                            <th class="p-4 border-r border-slate-200">Full File Name</th>
                            <th class="p-4 border-r border-slate-200">Generated On (Drive Date)</th>
                            <th class="p-4 text-center rounded-tr-xl w-32">Action</th>
                        </tr>
                    </thead>
                    <tbody id="reports-tbody-desktop" class="divide-y divide-slate-100 font-medium text-slate-700 align-middle">
                        <tr>
                            <td colspan="4" class="p-16 text-center text-slate-500 font-bold">
                                <div class="flex flex-col items-center justify-center gap-3">
                                    <i data-lucide="loader-2" class="w-8 h-8 animate-spin text-blue-600"></i>
                                    <span>Scanning Google Drive folders...</span>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- MOBILE COLLAPSIBLE CARDS VIEW -->
            <div id="reports-list-mobile" class="md:hidden flex flex-col gap-3 mb-4">
                <div class="p-12 text-center text-slate-400 font-bold">Scanning Google Drive...</div>
            </div>
            
            <!-- 🚀 LOAD MORE BUTTON -->
            <div id="load-more-container" class="hidden justify-center items-center p-6 border-t border-slate-100 mt-auto">
                <button onclick="loadReportsData(false, true)" id="load-more-btn" class="px-8 py-3 bg-blue-50 hover:bg-blue-100 text-blue-700 font-black text-xs rounded-2xl transition shadow-sm border border-blue-200 flex items-center justify-center gap-2 cursor-pointer w-full md:w-auto">
                    <i data-lucide="chevron-down" class="w-4 h-4"></i> Load Next 50 Reports
                </button>
            </div>

        </div>
    </div>
</div>

<script>
    window.API_URL = "https://script.google.com/macros/s/AKfycbxYMiv0JkwTGb0HAc-K6mBF5C9iXYdchW44GUmgmnLc7YHUDmJEU6LIyPtCFnF0H3l7/exec";
    
    window.moduleState = {
        agency: "Equalitas",
        dataCache: [],
        filteredData: [],
        nextPageToken: null,
        isLoading: false
    };

    // --- Global Top Progress Bar Helpers ---
    window.showTopProgress = function() {
        let bar = document.getElementById('global-top-progress-bar');
        if (!bar) {
            bar = document.createElement('div');
            bar.id = 'global-top-progress-bar';
            bar.style.cssText = 'position: fixed; top: 0; left: 0; width: 100%; height: 4px; z-index: 999999; overflow: hidden; display: none; background: transparent;';
            bar.innerHTML = '<div style="position: absolute; top: 0; left: -100%; height: 100%; background: linear-gradient(90deg, transparent, #2563eb, #3b82f6, transparent); animation: topProgressSlide 1.2s infinite ease-in-out;"></div>';
            
            const style = document.createElement('style');
            style.innerHTML = '@keyframes topProgressSlide { 0% { left: -100%; width: 40%; } 100% { left: 100%; width: 80%; } }';
            document.head.appendChild(style);
            document.body.appendChild(bar);
        }
        bar.style.display = 'block';
    };

    window.hideTopProgress = function() {
        const bar = document.getElementById('global-top-progress-bar');
        if (bar) bar.style.display = 'none';
    };

    if (typeof window.showToast !== 'function') {
        window.showToast = function(message) { alert(message); };
    }

    // --- Switch Agency ---
    window.switchAgencyView = function(agencyName) {
        if(window.moduleState.isLoading) return;
        window.moduleState.agency = agencyName;
        const activeClass = "flex-1 md:flex-none px-6 py-2.5 rounded-lg text-xs font-black transition bg-blue-600 text-white shadow-md";
        const inactiveClass = "flex-1 md:flex-none px-6 py-2.5 rounded-lg text-xs font-black transition text-slate-500 hover:text-slate-800 hover:bg-slate-200";
        document.getElementById('tab-Equalitas').className = agencyName === 'Equalitas' ? activeClass : inactiveClass;
        document.getElementById('tab-A-Mark').className = agencyName === 'A-Mark' ? activeClass : inactiveClass;
        
        document.getElementById("filter-search").value = "";
        loadReportsData(true);
    };

    // --- Fetch Data from Backend (Chunked & Fallback Proof) ---
    window.loadReportsData = async function(forceRefresh = false, isLoadMore = false) {
        if(window.moduleState.isLoading) return;
        window.moduleState.isLoading = true;

        const desktopTbody = document.getElementById("reports-tbody-desktop");
        const mobileContainer = document.getElementById("reports-list-mobile");
        const loadMoreBtn = document.getElementById("load-more-btn");
        
        if (!isLoadMore) {
            window.moduleState.dataCache = [];
            window.moduleState.nextPageToken = null;
            const loadingHtml = `<tr><td colspan="4" class="p-16 text-center text-slate-500 font-bold"><div class="flex flex-col items-center justify-center gap-3"><i data-lucide="loader-2" class="w-8 h-8 animate-spin text-blue-600"></i><span>Loading reports...</span></div></td></tr>`;
            if(desktopTbody) desktopTbody.innerHTML = loadingHtml;
            if(mobileContainer) mobileContainer.innerHTML = `<div class="p-12 text-center text-slate-500 font-bold flex flex-col items-center gap-3"><i data-lucide="loader-2" class="w-8 h-8 animate-spin text-blue-600"></i></div>`;
            document.getElementById("load-more-container").classList.add("hidden");
            document.getElementById("load-more-container").classList.remove("flex");
        } else {
            if(loadMoreBtn) {
                loadMoreBtn.innerHTML = `<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> Fetching...`;
                loadMoreBtn.disabled = true;
            }
        }
        
        if(window.lucide) lucide.createIcons();

        try {
            const payload = { 
                action: "getAllReports", 
                agency: window.moduleState.agency,
                pageToken: window.moduleState.nextPageToken
            };
            
            const response = await fetch(window.API_URL, {
                method: "POST",
                redirect: "follow",
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify(payload)
            });

            const result = await response.json();

            if (result.status === "success" || result.status === true) {
                // 🔥 DEFENSIVE LOGIC: Catch paginated OR non-paginated arrays automatically
                let newReports = [];
                if (Array.isArray(result.data)) {
                    newReports = result.data;
                } else if (result.data && Array.isArray(result.data.reports)) {
                    newReports = result.data.reports;
                }

                window.moduleState.dataCache = window.moduleState.dataCache.concat(newReports);
                window.moduleState.nextPageToken = result.data.nextPageToken || null;
                window.applyFilters();
                
                const loadContainer = document.getElementById("load-more-container");
                if (window.moduleState.nextPageToken) {
                    loadContainer.classList.remove("hidden");
                    loadContainer.classList.add("flex");
                } else {
                    loadContainer.classList.add("hidden");
                    loadContainer.classList.remove("flex");
                }

            } else {
                throw new Error(result.message);
            }
        } catch (err) {
            if (!isLoadMore) {
                const errorHtml = `<tr><td colspan="4" class="p-12 text-center text-rose-500 font-bold">Error: ${err.message}</td></tr>`;
                if(desktopTbody) desktopTbody.innerHTML = errorHtml;
                if(mobileContainer) mobileContainer.innerHTML = `<div class="p-12 text-center text-rose-500 font-bold">Error: ${err.message}</div>`;
            } else {
                window.showToast("Failed to load more reports.", "error");
            }
        } finally {
            window.moduleState.isLoading = false;
            if(loadMoreBtn) {
                loadMoreBtn.innerHTML = `<i data-lucide="chevron-down" class="w-4 h-4"></i> Load Next 50 Reports`;
                loadMoreBtn.disabled = false;
                if(window.lucide) lucide.createIcons();
            }
        }
    };

    // --- Search Filter ---
    window.applyFilters = function() {
        const searchQ = (document.getElementById("filter-search")?.value || "").toLowerCase();
        
        const filtered = window.moduleState.dataCache.filter(row => {
            const fName = String(row.fileName || row.name || row.title || "").toLowerCase();
            return fName.includes(searchQ);
        });

        window.moduleState.filteredData = filtered; 
        window.renderDataTable(filtered);
    };

    // --- Render Tables & Cards ---
    window.renderDataTable = function(data) {
        const desktopTbody = document.getElementById("reports-tbody-desktop");
        const mobileContainer = document.getElementById("reports-list-mobile");
        
        document.getElementById("record-count").innerText = `${data.length} Loaded Reports`;

        if (data.length === 0) {
            const emptyHtml = `<tr><td colspan="4" class="p-12 text-center text-slate-400 italic font-bold">No reports loaded yet.</td></tr>`;
            if(desktopTbody) desktopTbody.innerHTML = emptyHtml;
            if(mobileContainer) mobileContainer.innerHTML = `<div class="p-12 text-center text-slate-400 italic font-bold">No reports loaded.</div>`;
            return;
        }

        const desktopFrag = document.createDocumentFragment();
        const mobileFrag = document.createDocumentFragment();

        data.forEach((row, index) => {
            
            // 🔥 DEFENSIVE PARSING: Catch exact file names no matter what Google returns
            let fileName = "Unknown File";
            if (typeof row === 'string') {
                fileName = row;
            } else if (row && typeof row === 'object') {
                fileName = row.fileName || row.name || row.title || "Unknown File";
            }

            let dateStr = "Unknown Date";
            if (row && typeof row === 'object') {
                const rawDate = row.dateCreated || row.date || row.timestamp;
                if (rawDate) {
                    const d = new Date(rawDate);
                    if (!isNaN(d.getTime())) {
                        dateStr = d.toLocaleString('en-IN', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
                    }
                }
            }
            
            const safeFileName = fileName.replace(/'/g, "\\'").replace(/"/g, "&quot;");

            const tr = document.createElement("tr");
            tr.className = "hover:bg-blue-50/50 transition border-b border-slate-100 group";
            tr.innerHTML = `
                <td class="p-4 border-r border-slate-100 text-center font-bold text-slate-400">${index + 1}</td>
                <td class="p-4 border-r border-slate-100">
                    <div class="font-black text-blue-700 flex items-center gap-2">
                        <i data-lucide="file-code-2" class="w-4 h-4 text-purple-500 shrink-0"></i> 
                        <span class="break-all">${fileName}</span>
                    </div>
                </td>
                <td class="p-4 border-r border-slate-100 font-bold text-slate-600 whitespace-nowrap">
                    ${dateStr}
                </td>
                <td class="p-4 text-center">
                    <button onclick="window.viewReport('${safeFileName}', '${window.moduleState.agency}', event)" class="w-full py-2.5 bg-purple-100 hover:bg-purple-200 text-purple-700 font-black text-xs rounded-xl transition shadow-sm cursor-pointer flex items-center justify-center gap-2 group-hover:bg-purple-600 group-hover:text-white border border-purple-200" title="Open Rendered HTML Report">
                        <i data-lucide="external-link" class="w-3.5 h-3.5"></i> Open
                    </button>
                </td>
            `;
            desktopFrag.appendChild(tr);

            const card = document.createElement("div");
            card.className = "bg-white p-4 rounded-2xl border border-slate-200 shadow-sm flex flex-col gap-3";
            card.innerHTML = `
                <div class="flex items-center justify-between border-b border-slate-100 pb-2.5">
                    <div>
                        <span class="text-[10px] font-black text-slate-400 uppercase tracking-wider block">Generated On</span>
                        <span class="text-xs font-bold text-slate-600">${dateStr}</span>
                    </div>
                </div>
                <div class="flex items-center gap-2 text-sm font-black text-blue-700 bg-slate-50 p-2.5 rounded-lg border border-slate-100">
                    <i data-lucide="file-code-2" class="w-5 h-5 text-purple-500 shrink-0"></i> <span class="break-all">${fileName}</span>
                </div>
                <div class="pt-2 border-t border-slate-100">
                    <button onclick="window.viewReport('${safeFileName}', '${window.moduleState.agency}', event)" class="w-full py-3 px-4 bg-purple-50 hover:bg-purple-100 text-purple-700 rounded-xl font-black text-xs transition flex items-center justify-center gap-1.5 cursor-pointer border border-purple-200">
                        <i data-lucide="external-link" class="w-4 h-4"></i> Open Report
                    </button>
                </div>
            `;
            mobileFrag.appendChild(card);
        });

        if(desktopTbody) { desktopTbody.innerHTML = ""; desktopTbody.appendChild(desktopFrag); }
        if(mobileContainer) { mobileContainer.innerHTML = ""; mobileContainer.appendChild(mobileFrag); }
        if(window.lucide) window.lucide.createIcons();
    };

    // --- View HTML Report in New Tab ---
    window.viewReport = async function(fileName, agency, event) {
        if(event) event.stopPropagation();
        
        if (!fileName || String(fileName).trim() === "" || fileName === "Unknown File") {
            window.showToast("Cannot view report: Invalid File Name.", "error");
            return;
        }

        const btn = event ? event.currentTarget : null;
        let originalHTML = "";
        let originalWidth = "";
        
        if(btn) {
            originalWidth = btn.style.width;
            btn.style.width = btn.offsetWidth + 'px'; 
            originalHTML = btn.innerHTML;
            
            const hasText = btn.textContent.trim().length > 0;
            const iconSize = originalHTML.includes('w-4') ? 'w-4 h-4' : 'w-3.5 h-3.5';
            
            btn.innerHTML = hasText 
                ? `<i data-lucide="loader-2" class="${iconSize} animate-spin"></i> <span class="animate-pulse ml-1.5">Opening...</span>`
                : `<i data-lucide="loader-2" class="${iconSize} animate-spin"></i>`;
                
            btn.disabled = true;
            btn.classList.add('cursor-wait', 'opacity-90');
            if(window.lucide) window.lucide.createIcons();
        }

        window.showTopProgress();

        try {
            const payload = { 
                action: "getArchiveReportUrl", 
                agency: agency,
                fileName: fileName
            };
            const response = await fetch(window.API_URL, { 
                method: 'POST', 
                redirect: 'follow', 
                body: JSON.stringify(payload), 
                headers: { "Content-Type": "text/plain;charset=utf-8" } 
            });
            const result = await response.json();
            
            if (result.status === "success" || result.status === true) {
                const newWindow = window.open("", "_blank");
                if (newWindow) {
                    newWindow.document.open();
                    newWindow.document.write(result.data.htmlContent);
                    newWindow.document.close();
                } else {
                    window.showToast("Popup blocked! Please allow popups for this site.", "error");
                }
            } else {
                window.showToast(result.message || "Report not found in Drive.", "error");
            }
        } catch (error) {
            console.error("Fetch Error:", error);
            window.showToast("Error communicating with server.", "error");
        } finally {
            window.hideTopProgress();
            if(btn) {
                btn.innerHTML = originalHTML;
                btn.style.width = originalWidth; 
                btn.disabled = false;
                btn.classList.remove('cursor-wait', 'opacity-90');
                if (window.lucide) window.lucide.createIcons();
            }
        }
    };

    // Initialize application logic
    document.addEventListener('DOMContentLoaded', () => {
        if(window.lucide) lucide.createIcons();
        loadReportsData(false, false);
    });

</script>
